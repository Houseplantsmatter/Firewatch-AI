version: 2
model: yolo11s.pt
data: data_v2.yaml
project: runs/detect
name: fire_smoke_v2
train:
  epochs: 80
  imgsz: 640
  batch: 8
  device: 0
  workers: 2
  patience: 15
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  pretrained: true
  amp: true
  cache: false
  seed: 42
  deterministic: true
  save_period: 5
  val: true
  plots: true
  degrees: 5.0
  translate: 0.1
  scale: 0.4
  shear: 2.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  hsv_h: 0.015
  hsv_s: 0.6
  hsv_v: 0.4
  mosaic: 0.8
  mixup: 0.05
  close_mosaic: 10
evaluation:
  split: test
  imgsz: 640
  batch: 8
  device: 0
  half: true
  plots: true
